{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>会员管理</h1>
    <ul class="card-list">
        {% for user in users %}
        <li class="card">
            <h3>{{ user.username }}</h3>
            <p>ID：{{ user.id }}</p>
            <a href="/admin/member/{{ user.id }}/delete" class="btn btn-danger btn-sm">删除</a>
        </li>
        {% else %}
        <li class="card">暂无会员</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
