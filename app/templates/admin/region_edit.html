{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>编辑地区</h1>
    <form method="post">
        <label>地区名称</label>
        <input type="text" name="name" value="{{ region.name }}" required>

        <label>地区介绍</label>
        <textarea name="description" rows="4">{{ region.description or '' }}</textarea>

        <button type="submit" class="btn">保存</button>
        <a href="/admin/regions" class="btn btn-danger">取消</a>
    </form>
</div>
{% endblock %}
