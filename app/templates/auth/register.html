{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>用户注册</h1>
    <form method="post">
        <label>用户名</label>
        <input type="text" name="username" required>
        <label>密码</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn">注册</button>
    </form>
    <p style="text-align:center; margin-top:15px;">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
</div>
{% endblock %}
