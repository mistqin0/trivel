{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 400px; margin: 50px auto; text-align: center;">
    <h1 style="margin-bottom: 30px; text-align: left;">管理员登录</h1>
    <form method="POST" action="{{ url_for('admin.login') }}" style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <div class="form-group" style="margin-bottom: 20px; text-align: left;">
            <label for="username">管理员账号</label>
            <input type="text" id="username" name="username" placeholder="请输入管理员账号" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 5px;">
        </div>
        <div class="form-group" style="margin-bottom: 25px; text-align: left;">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 5px;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1.1em;">登录</button>
    </form>
</div>
{% endblock %}
