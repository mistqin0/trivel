{% extends 'base.html' %}

{% block content %}
<div class="container">
    {% if scenic %}
    <h1>{{ scenic.name }}</h1>
    <div class="scenic-meta">地区：{{ scenic.region.name if scenic.region else '未知' }}</div>
    <p class="scenic-description">{{ scenic.description }}</p>
    <a href="/favorite/add/{{ scenic.id }}" class="btn">收藏</a>
    <a href="/scenics" class="btn btn-success">返回列表</a>
    {% else %}
    <p>景区不存在或已被删除</p>
    {% endif %}
</div>
{% endblock %}
