{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>编辑游记</h1>
    <form method="post">
        <label>标题</label>
        <input type="text" name="title" value="{{ travelog.title }}" required>

        <label>内容</label>
        <textarea name="content" rows="8">{{ travelog.content or '' }}</textarea>

        <button type="submit" class="btn">保存</button>
        <a href="/admin/travelogs" class="btn btn-danger">取消</a>
    </form>
</div>
{% endblock %}
