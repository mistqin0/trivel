{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>用户登录</h1>
    <form method="post">
        <label>用户名</label>
        <input type="text" name="username" required>
        <label>密码</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn">登录</button>
    </form>
    <p style="text-align:center; margin-top:15px;">还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></p>
</div>
{% endblock %}
